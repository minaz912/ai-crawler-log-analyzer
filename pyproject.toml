[project]
name = "aicrawl"
version = "0.1.0"
description = "Analyze web server / CDN logs for AI crawler activity: who, what, how often, verified, and allowed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
aicrawl = "aicrawl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aicrawl"]
